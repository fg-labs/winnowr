[package]
name = "winnowr-xgboost"
version.workspace = true
authors.workspace = true
description = "Statically linked XGBoost (vendored source) with a small safe API, for winnowr."
edition.workspace = true
rust-version.workspace = true
# The crate's own code is MIT; the vendored XGBoost and dmlc-core sources are Apache-2.0.
license = "MIT AND Apache-2.0"
repository.workspace = true
keywords = ["xgboost", "machine-learning", "ffi"]
categories = ["external-ffi-bindings", "science"]
links = "xgboost"
# Ship only the parts of the vendored source tree that the CMake build needs.
include = [
    "/Cargo.toml",
    "/build.rs",
    "/build/*.rs",
    "/src/**",
    "/README.md",
    "/LICENSE-MIT",
    # The integration tests, so that `cargo test` runs them from the published source too (any
    # layout cargo finds, including helper modules in subdirectories).
    "/tests/**",
    # winnowr's fixes and performance changes to the vendored sources, applied by build.rs to a
    # copy of them.
    "/patches/*.patch",
    # Keeps the patches directory, which build.rs reads, when there are no patches.
    "/patches/.gitkeep",
    "/vendor/xgboost/CMakeLists.txt",
    "/vendor/xgboost/LICENSE",
    "/vendor/xgboost/NEWS.md",
    "/vendor/xgboost/cmake/**",
    "/vendor/xgboost/include/**",
    "/vendor/xgboost/src/**",
    "/vendor/xgboost/plugin/**",
    "/vendor/xgboost/dmlc-core/CMakeLists.txt",
    "/vendor/xgboost/dmlc-core/LICENSE",
    "/vendor/xgboost/dmlc-core/cmake/**",
    "/vendor/xgboost/dmlc-core/include/**",
    "/vendor/xgboost/dmlc-core/src/**",
]

[dependencies]
# getrusage and its struct layouts, which differ by target (e.g. 64-bit time_t on 32-bit Linux
# ABIs), for the process CPU time (see `process_cpu_time` in src/lib.rs).
libc = "0.2.191"
serde_json = "1.0.154"

[build-dependencies]
cc = "1.11.2"
cmake = "0.1.58"

[dev-dependencies]
rstest = "0.28.0"

# docs.rs documents Linux only, since the crate supports only macOS and Linux; build.rs skips the
# XGBoost build there.
[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[package.metadata.dist]
# A library: dist builds and ships only the winnowr binary.
dist = false
