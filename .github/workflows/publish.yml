name: Manage Release PRs and Publish Crates

# Both jobs give release-plz a token of the fg-labs-bot GitHub App (from the organization secrets
# FG_LABS_BOT_APP_ID and FG_LABS_BOT_PRIVATE_KEY), which it creates the release PR's branch and
# the version tag with through the GitHub API. Events made with an app token run workflows: the
# release PR runs CI and the tag runs the release workflow. Events made with the workflow's
# GITHUB_TOKEN do not, so GITHUB_TOKEN only needs to read. The checkouts do not keep a token in
# the git config, since release-plz only fetches with git.
#
# Crates are published with crates.io trusted publishing, which names this file (publish.yml):
# see "Release credentials" in docs/DEVELOPING.md.
permissions:
  contents: read

on:
  push:
    branches:
      - main

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Opens or updates the release PR (version bump and changelog from conventional commits).
  release-pr:
    runs-on: ubuntu-22.04
    # Only in fg-labs/winnowr: forks have neither the app's secrets nor the crates.io publisher.
    if: ${{ github.repository == 'fg-labs/winnowr' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Install libclang (bindgen, for htslib)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      # Minted last, so that the setup steps do not use up the token's hour.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.FG_LABS_BOT_APP_ID }}
          private-key: ${{ secrets.FG_LABS_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # Moving the release PR's branch to a main that changed a workflow needs this.
          permission-workflows: write
      - name: Create or update release PR
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  # When a release PR merges (and only then: `release_always = false` in release-plz.toml),
  # publishes winnowr-xgboost then winnowr to crates.io and pushes the version tag, which
  # triggers the dist release workflow (binaries and GitHub release).
  release:
    runs-on: ubuntu-22.04
    # Only in fg-labs/winnowr: forks have neither the app's secrets nor the crates.io publisher.
    if: ${{ github.repository == 'fg-labs/winnowr' }}
    permissions:
      contents: read
      # Trusted publishing: lets release-plz request the OIDC token it exchanges with crates.io
      # for a short-lived publish token (revoked once every crate is published, otherwise left
      # to expire).
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Install libclang (bindgen, for htslib)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      # Minted last, so that the setup steps do not use up the token's hour. Workflows write in
      # case GitHub checks it when the tag is created on a commit older than a main whose
      # workflows have since changed.
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.FG_LABS_BOT_APP_ID }}
          private-key: ${{ secrets.FG_LABS_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
          permission-workflows: write
      - name: Publish crates and tag the release
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # No CARGO_REGISTRY_TOKEN: when it is unset, release-plz uses trusted publishing (it
          # implements rust-lang/crates-io-auth-action's token exchange itself, and its docs say
          # not to combine the two).
