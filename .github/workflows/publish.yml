name: Manage Release PRs and Publish Crates

# Both jobs act on GitHub with RELEASE_PLZ_TOKEN (a personal access token, so that the release
# PR it opens runs CI and the tag it pushes triggers the release workflow), not the workflow's
# GITHUB_TOKEN, which only needs to read. The checkout keeps that token in the git config:
# release-plz pushes the release PR's branch and the tag with it.
#
# Crates are published with crates.io trusted publishing, which names this file (publish.yml):
# see "Release credentials" in docs/DEVELOPING.md.
permissions:
  contents: read

on:
  push:
    branches:
      - main

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Opens or updates the release PR (version bump and changelog from conventional commits).
  release-pr:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Install libclang (bindgen, for htslib)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - name: Create or update release PR
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

  # When a release PR merges (and only then: `release_always = false` in release-plz.toml),
  # publishes winnowr-xgboost then winnowr to crates.io and pushes the version tag, which
  # triggers the dist release workflow (binaries and GitHub release).
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      # Trusted publishing: lets release-plz request the OIDC token it exchanges with crates.io
      # for a short-lived publish token (revoked once every crate is published, otherwise left
      # to expire).
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - name: Install libclang (bindgen, for htslib)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev
      - name: Install Rust toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - name: Publish crates and tag the release
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          # No CARGO_REGISTRY_TOKEN: when it is unset, release-plz uses trusted publishing (it
          # implements rust-lang/crates-io-auth-action's token exchange itself, and its docs say
          # not to combine the two).
