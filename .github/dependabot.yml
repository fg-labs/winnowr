version: 2
updates:
  # Maintain dependencies for Cargo
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all-cargo-deps:
        patterns: ["*"]

  # Maintain dependencies for GitHub Actions. release.yml is generated by `dist generate`, which
  # would undo a bump there: its actions are pinned in Cargo.toml
  # ([workspace.metadata.dist.github-action-commits]) instead.
  - package-ecosystem: github-actions
    directory: "/"
    exclude-paths:
      - ".github/workflows/release.yml"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all-actions:
        patterns: ["*"]
