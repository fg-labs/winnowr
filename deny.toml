# cargo-deny configuration for winnowr.
#
# Run locally: `cargo deny check`
# CI:          `.github/workflows/deny.yml` (weekly + on PR)
#
# Schema docs: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------------------
# Advisories: fail on known CVEs, unmaintained crates, yanked versions.
# Pulls from https://github.com/RustSec/advisory-db
# ---------------------------------------------------------------------------
[advisories]
version = 2
# Fail (not just warn) on a yanked dependency: for a published crate a yanked
# transitive dep is a real supply-chain signal worth blocking CI on.
yanked = "deny"
ignore = [
    # custom_derive (via rust-htslib) is unmaintained but has no known vulnerability; it only
    # provides compile-time derive macros. Drop this when rust-htslib replaces it.
    { id = "RUSTSEC-2025-0058", reason = "unmaintained macro-only dependency of rust-htslib" },
    # chrono (a dependency of both arrow-array and parquet) is unmaintained but has no known
    # vulnerability, and no maintained version exists. Drop this when arrow-rs (arrow-array and
    # parquet) replaces it.
    { id = "RUSTSEC-2026-0543", reason = "unmaintained dependency of arrow/parquet, no fix available" },
]

# ---------------------------------------------------------------------------
# Licenses: only permissive MIT-compatible licenses are allowed. Anything
# weak/strong copyleft (LGPL, GPL, AGPL, MPL) or proprietary will fail the
# check. The allow-list reflects the licenses currently present in the
# transitive dep tree; add new entries only after a deliberate decision.
# ---------------------------------------------------------------------------
[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    # zstd (via parquet).
    "BSD-2-Clause",
    # bindgen (a build dependency of rust-htslib's hts-sys), and zstd.
    "BSD-3-Clause",
    # tiny-keccak (via arrow's ahash, compile-time constants only).
    "CC0-1.0",
    # libloading (via bindgen's clang-sys, build-time only).
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]

# ---------------------------------------------------------------------------
# Bans: control duplicate versions and ban specific crates.
# `multiple-versions = "warn"` because some duplication is normal in a
# healthy dep tree (e.g. proc-macro libs that bridge syn 1.x → 2.x).
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

# ---------------------------------------------------------------------------
# Sources: deps must come from a known registry / git host. Defends against
# typo-squatting and accidental forks.
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
